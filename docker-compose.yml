services:
  # ============================================================
  # 1. PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: drive-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-147575}
      POSTGRES_DB: ${POSTGRES_DB:-drive}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-drive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - drive-network

  # ============================================================
  # 2. LocalStack (AWS S3 Mock)
  # ============================================================
  localstack:
    image: localstack/localstack:latest
    container_name: drive-localstack
    ports:
      - "4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      - SERVICES=s3
      - DEBUG=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - drive-network

  # ============================================================
  # 3. Prometheus (Metrics Scraper)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: drive-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - drive-network

  # ============================================================
  # 4. Loki (Log Aggregation)
  # ============================================================
  loki:
    image: grafana/loki:3.0.0
    container_name: drive-loki
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - drive-network

  # ============================================================
  # 5. Tempo (Distributed Tracing)
  # ============================================================
  tempo:
    image: grafana/tempo:latest
    container_name: drive-tempo
    ports:
      - "3200:3200"   # Tempo HTTP UI / API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./docker/tempo/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks:
      - drive-network

  # ============================================================
  # 6. Grafana (Dashboard & Visualizer)
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: drive-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - drive-network

volumes:
  postgres-data:
  localstack-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  drive-network:
    driver: bridge